# XcodeGen 설정: GitHub Actions에서 이 파일로 KenStudio.xcodeproj를 자동 생성합니다.
name: KenStudio
options:
  bundleIdPrefix: com.personal.kenstudio
  deploymentTarget:
    iOS: "16.0"
targets:
  KenStudio:
    type: application
    platform: iOS
    sources:
      - KenStudio
    info:
      path: KenStudio/Info.plist
      properties:
        CFBundleDisplayName: Kenstudio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.kenstudio.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
